                taylor series, taylor s theorem, maclaurin series, partial derivative,
                multiple integral, double integral, triple integral, maxima and minima,
                successive differentiation, improper integral, curve tracing, jacobian,
                chain rule, polar coordinates, arc length, l hospital s rule, l hospital rule, beta and gamma functions, beta function, gamma function, reduction formula, curvature, asymptote, rolle s theorem]
      - id: real_analysis
        name: Real Analysis
        terms: [real analysis, sequences and series, sequence of real numbers, cauchy sequence,
