# Skill taxonomy for undergraduate Mathematics programmes.
#
# Each skill lists the syllabus phrases ("terms") that count as evidence for
# it. Matching ignores case and punctuation, accepts a plural ending (s/es),
# and prefers the longest phrase: "partial differential equations" is
# evidence for PDEs, not for ODEs, and "linear programming" is evidence for
# optimisation, not for programming. A term may appear under more than one
# skill (e.g. "matplotlib" is both Python and visualisation).
#
# Write British and American spellings separately. Apostrophes become
# spaces, so "Green's theorem" is written "green s theorem".

name: Undergraduate Mathematics
version: 1

areas:
